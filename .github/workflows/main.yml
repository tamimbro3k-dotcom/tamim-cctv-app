name: Build Tamim CCTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir app-project
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d app-project

      - name: Find project
        id: find
        run: |
          PROJECT=$(find app-project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Fix Android and Kotlin code
        working-directory: ${{ steps.find.outputs.project }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/tamimcctv/app/MainActivity.kt")
          text = p.read_text()

          old = '''@Composable
          fun TamimApp() {
              var tab by remember { mutableStateOf(0) }
              var selected by remember { mutableStateOf<Product?>(null) }
          '''

          new = '''@Composable
          fun TamimApp() {
              val activity = LocalContextHolder.current as MainActivity
              var tab by remember { mutableStateOf(0) }
              var selected by remember { mutableStateOf<Product?>(null) }
          '''

          text = text.replace(old, new)

          text = text.replace(
              '(LocalContextHolder.current as MainActivity).openUrl(WEBSITE_URL)',
              'activity.openUrl(WEBSITE_URL)'
          )

          text = text.replace(
              '(LocalContextHolder.current as MainActivity).whatsapp()',
              'activity.whatsapp()'
          )

          p.write_text(text)

          print("MainActivity.kt fixed successfully")
          PY

      - name: Fix JVM targets
        working-directory: ${{ steps.find.outputs.project }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Build APK
        working-directory: ${{ steps.find.outputs.project }}
        run: |
          gradle :app:assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tamim-CCTV-APK
          path: app-project/**/app/build/outputs/apk/debug/*.apk
